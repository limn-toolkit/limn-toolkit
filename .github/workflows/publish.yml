# Publishes the library modules to Maven Central, off a tag, and drafts the GitHub release.
#
# The version comes from the tag, and the tag comes from versions.properties through the
# tag-releases workflow: build.gradle.kts reads -PlimnVersion and otherwise says the -SNAPSHOT of
# that file, so bumping the file and pushing main is what makes a version exist. Nobody types a
# tag.
#
# The documentation names NO version. The READMEs, rendered raw by GitHub, write `x.y.z` and let
# the Maven Central badge say the number; the guides write `{{version}}`, which the site fills in
# at deploy time from the release it documents. A release therefore commits nothing, and the
# `verify` job below refuses a tag whose documentation carries a literal.
#
# Neither half of a release publishes itself. The upload STOPS at the Portal, where what arrives
# is a deployment, validated and staged, that somebody opens and presses Publish on; the GitHub
# release is created as a DRAFT. Both last steps are manual and belong together: until they
# happen a release can still be dropped, and Central keeps what it accepts — a wrong artifact
# cannot be replaced, only superseded by a version number nobody wanted to spend.
#
# Secrets this needs (repository settings → Secrets and variables → Actions):
#
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   the Portal USER TOKEN, not the login
#   SIGNING_KEY                                       `gpg --armor --export-secret-keys <id>`,
#                                                     BEGIN/END lines included
#   SIGNING_PASSWORD                                  that key's passphrase
#
# The public half of the key has to be on a public keyserver (keyserver.ubuntu.com,
# keys.openpgp.org) before this runs: Central verifies the signature against one, and a key it
# cannot find fails validation after the upload, not before it.

name: publish

on:
  push:
    tags: ["v*"]
  # For a re-run of a release whose upload failed after the tag already existed. It is not a way
  # to release something untagged: the tag is verified below, in both paths.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v. Blank takes versions.properties."
        required: false
        type: string
      force:
        description: "Upload again even though this version was already uploaded once"
        required: false
        default: false
        type: boolean

# Read-only for the workflow, and widened per JOB rather than here. The job that holds the
# credentials and runs the build gets nothing to write; the job that writes gets no credentials
# and no code. Granting write at this level would hand both to the same job, and that job
# executes the repository's own build.
permissions:
  contents: read

# A release is not something to run twice at once, and unlike the site's, a queued second run is
# not harmless: two uploads of one version race for the same deployment on the Portal.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The version and the tag, checked before anything is built. It is the cheapest job in the
  # file and everything else waits on it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To ask what this workflow has already done with this tag; see the last step.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full depth, for the tag check below: a shallow clone has the tag object without the
      # commit it points at, which cannot be compared to anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The version, from the tag or from the dispatch input, with the leading v removed.
      # Rejected here rather than by Gradle if it is not a version: the tag is a human's typing,
      # and `v0.1` or `0.1.0-SNAPSHOT` should not reach an upload.
      #
      # The input reaches the shell through env, never spliced into the script: a `${{ }}` inside
      # `run:` is substituted as text before the shell parses it, so the typed value is code until
      # the grep below has seen it, which is the wrong order. Every other step in these workflows
      # already takes its values this way.
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ -z "$VERSION" ]; then
              VERSION="$(sed -n 's/^limn-toolkit[[:space:]]*=[[:space:]]*//p' versions.properties | tr -d '[:space:]')"
              echo "version left blank; versions.properties says $VERSION"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
            echo "::error::'$VERSION' is not a release version (expected 1.2.3, or 1.2.3-rc1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      # Every published version is a tag, and this is what makes that true rather than customary.
      # On a tag push it passes by construction; on a dispatch it is the whole point, because
      # that trigger otherwise publishes whatever branch it was pointed at and leaves no record
      # of what the artifact was built from. A release nobody can check out is not one anybody
      # can support.
      - name: Verify the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::$TAG does not exist. A push to main with the bumped versions.properties creates it."
            exit 1
          fi
          TAGGED="$(git rev-parse "$TAG^{commit}")"
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $TAGGED, not at the commit being built ($GITHUB_SHA)"
            exit 1
          fi
          echo "$TAG is $TAGGED"

      # The documentation must name no toolkit version — placeholders only — and every pinned
      # coordinate it does name (fonts, FFmpeg payload, icon pack) must agree with the catalog.
      # Twenty seconds here, before a build is spent on a tag that would ship a wrong number.
      - name: The documentation must carry placeholders, not versions
        run: bash scripts/check-versions.sh

      # One upload per version, enforced rather than assumed.
      #
      # Pushing a branch and a tag together makes GitHub emit an event per ref, and it has
      # produced TWO identical publish runs for one tag — created in the same second, the second
      # queued behind the first by the concurrency group. Left alone it would upload 0.2.0 to the
      # Portal a second time, and the person deciding what to release would find two deployments
      # of one version and have to work out which.
      #
      # A SUCCESSFUL earlier run is the signal, which is what makes this safe for the case the
      # dispatch trigger exists for: a run that failed leaves nothing behind, so re-running after
      # a fix still works. Deliberately replacing an upload — after dropping its deployment on the
      # Portal — is what `force` is for.
      - name: Refuse a second upload of the same version
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          PRIOR="$(gh run list --workflow publish.yml --branch "$TAG" --status success \
                     --limit 20 --json url --jq '.[0].url // empty')"
          if [ -n "$PRIOR" ]; then
            echo "::error::$TAG has already been uploaded, by $PRIOR. Nothing was sent this time."
            echo "::error::If that deployment was dropped on the Portal and you mean to replace it, re-run this workflow from the Actions tab with 'force' ticked."
            exit 1
          fi
          echo "no successful publish run for $TAG yet"

  # The Showcase compiled ahead of time with GraalVM's native-image, from nothing but the metadata
  # the toolkit's own jars carry and the demo's list of its own files, on one machine of each
  # system. It is a gate before the upload, like check: the jars a release publishes are the ones
  # an application builds its image from, and a resource or a lookup left out of their metadata
  # breaks that image and no test on the JVM. Here and not on every push because a build takes
  # minutes per system and what it guards changes rarely.
  #
  # Linux and Windows also start the image and open the video page, which loads every kind of
  # native library the toolkit ships: under Xvfb with Mesa as ci.yml runs the tests, and on ANGLE
  # over Direct3D's software device as angle.yml does. The macOS runner is a virtual machine with
  # no GPU and nothing has measured what context a window gets there, so it builds only.
  native-image:
    needs: verify
    name: Native image, ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux-x64, runner: ubuntu-latest, archive: linux-x64_bin.tar.gz,
              sha256: 05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2 }
          - { os: macos-aarch64, runner: macos-latest, archive: macos-aarch64_bin.tar.gz,
              sha256: 4ec9932aa4aab1afca0ea31982d32d6f956615c61fe21a227b49756b25adda4f }
          - { os: windows-x64, runner: windows-2025, archive: windows-x64_bin.zip,
              sha256: 2733ea1331f1a98b05dd55a768b07347051dad48f030dbbfa191b11a2ccf4144 }
    defaults:
      run:
        shell: bash
    env:
      # The GraalVM the site's guide names, from its own releases, checked against the digest
      # written above rather than one fetched beside the archive.
      GRAAL_TAG: graal-25.4.4.1.1
      GRAAL_PREFIX: graalvm-community-jdk-25i4-25.0.4.1.1_
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the runnable demo jar
        run: ./gradlew :limn-demo:fatJar -PlimnVersion="$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - name: Install GraalVM
        run: |
          mkdir -p "$RUNNER_TEMP/graalvm" && cd "$RUNNER_TEMP/graalvm"
          curl -fsSLo "graalvm-${{ matrix.archive }}" \
            "https://github.com/graalvm/graalvm-ce-builds/releases/download/${GRAAL_TAG}/${GRAAL_PREFIX}${{ matrix.archive }}"
          sum=sha256sum; command -v sha256sum >/dev/null || sum="shasum -a 256"
          echo "${{ matrix.sha256 }}  graalvm-${{ matrix.archive }}" | $sum -c
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "graalvm-${{ matrix.archive }}" ;;
            *) tar xzf "graalvm-${{ matrix.archive }}" ;;
          esac
          home=$(find "$PWD" -maxdepth 4 -type f \( -name native-image -o -name native-image.cmd \) -path '*/bin/*' | head -1)
          home=$(dirname "$(dirname "$home")")
          [ "$RUNNER_OS" = Windows ] && home=$(cygpath -w "$home")
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"

      - name: Build the image (Linux, macOS)
        if: runner.os != 'Windows'
        # The macOS runner has 7 GB; the builder's default heap here is 6 GB.
        run: XMX=${{ runner.os == 'macOS' && '4g' || '6g' }} JOBS=3 scripts/native-image/build.sh
        env:
          DEMO_JAR: limn-demo/build/libs/limn-demo-all.jar

      - name: Build the image (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\native-image\build.cmd
        env:
          DEMO_JAR: limn-demo\build\libs\limn-demo-all.jar

      - name: Install Xvfb and Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxxf86vm1

      # The video page: the clip comes out of the image's resources, FFmpeg's libraries are
      # extracted from it and decode the clip, and the picture is drawn, so a library, a shader or
      # a lookup missing from the metadata stops it here.
      - name: Start the image on the video page
        if: runner.os != 'macOS'
        run: |
          image=build/native-image/limn-demo
          run=()
          [ "$RUNNER_OS" = Linux ] && run=(xvfb-run -a)
          "${run[@]}" "$image" -Dlimn.demo.page=video --scene app \
            --screenshot build/native-image/video.png --exit-after 30000 2>&1 | tee build/native-image/video.log
          grep -q "Video: 'Clip' opened" build/native-image/video.log
          test -s build/native-image/video.png
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-image-${{ matrix.os }}
          path: |
            build/native-image/*.png
            build/native-image/*.log
          if-no-files-found: ignore
          retention-days: 7

  # No native build in here any more (ADR 037): the FFmpeg payload is the limn-ffmpeg-natives
  # artifact, released from its own repository on FFmpeg's schedule, and the version this
  # toolkit was tested with is pinned in gradle/libs.versions.toml like any other dependency.
  # (The native-image job above compiles the demo, not a payload.)
  publish:
    needs: [verify, native-image]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      # Full depth, for the tag check below: a shallow clone has the tag object without the
      # commit it points at, which cannot be compared to anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Must match the toolchain in build.gradle.kts, for the reason that file gives: the
          # Javadoc doclet differs between 17 and 21, and a published javadoc jar is an artifact
          # like any other. What the classes TARGET is 17 either way (options.release).
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # GLFW needs a display and Mesa needs its software rasteriser: llvmpipe provides the
      # OpenGL 3.3 core profile the backend requires, with no GPU on the runner. Same list as
      # ci.yml, and for the same reason: trimming it does not fail here, it fails inside a
      # Gradle task where the cause is much harder to read.
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxxf86vm1

      # The whole gate, before the upload, and this is the one workflow where skipping it is not
      # a trade: the PR gate protects a merge, which can be reverted. This protects a publication,
      # which cannot. `check` also builds the javadoc that ships in the jars.
      - name: Gradle check
        run: >-
          xvfb-run -a ./gradlew check
          -PlimnVersion="$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      # ORG_GRADLE_PROJECT_<name> is how a Gradle property arrives from an environment, which is
      # what keeps every one of these out of the repository and out of the command line (a -P
      # would put the passphrase in the process list and in the log).
      - name: Publish to Maven Central
        run: >-
          ./gradlew publishToMavenCentral
          -PlimnVersion="$VERSION"
          --no-daemon
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # The demo, as one file a stranger can run: `jbang <url>` and the showcase is on
      # screen. Its FFmpeg payload for every desktop comes off the classpath now (the demo names
      # all six classifiers), so no merge step precedes this. Built HERE and not in draft-release
      # because that job deliberately has no checkout and no build.
      - name: Build the runnable demo jar
        run: >-
          ./gradlew :limn-demo:fatJar
          -PlimnVersion="$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limn-demo-all
          path: limn-demo/build/libs/limn-demo-all.jar
          if-no-files-found: error
          retention-days: 1

  # The only job in this file that can write to the repository, and deliberately the smallest:
  # no checkout, no build, no secrets. It cannot run anything the tag brought with it, because it
  # never fetches it — the demo jar it attaches is an artifact the job before it produced, and
  # downloading a built file is not the same as running a tree.
  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limn-demo-all
          path: release-assets

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          # A re-run after a failed upload finds its own draft from the first attempt. Editing it
          # would overwrite notes somebody may have already written by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release already exists for $TAG; leaving it untouched"
            exit 0
          fi
          # The section of CHANGELOG.md this release ships: the newest, which the file's own rule
          # makes complete on the day of the tag. Read through the API as data, as the jar is
          # downloaded, so this job still runs nothing the tag brought. GitHub refuses a body over
          # 125 000 characters, and the section 1.0.0 shipped had 189 000, so a section that long
          # is left to the link below it.
          CHANGES=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GH_REPO/contents/CHANGELOG.md?ref=$TAG" \
            | awk '/^## /{n++; if (n==1) {sub(/^## After /, "## What changed since "); print; next}} n==1')
          if [ -z "$CHANGES" ] || [ ${#CHANGES} -gt 100000 ]; then
            CHANGES="## What changed

          Too long for this page: the newest section of the changelog linked below."
          fi
          # --notes is PREPENDED to what --generate-notes produces, so the coordinates lead, the
          # changelog's section follows and the commit list closes.
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            --notes "$(cat <<NOTES
          Published to Maven Central as \`io.github.limn-toolkit\`.

          \`\`\`kotlin
          dependencies {
              implementation("io.github.limn-toolkit:limn-backend-lwjgl:$VERSION")
          }
          \`\`\`

          <details>
          <summary>Maven</summary>

          \`\`\`xml
          <dependency>
            <groupId>io.github.limn-toolkit</groupId>
            <artifactId>limn-backend-lwjgl</artifactId>
            <version>$VERSION</version>
          </dependency>
          \`\`\`

          </details>

          That one line brings \`limn-toolkit\` with it — and the fonts a UI cannot do
          without (Roboto and the complex-script faces, from their own artifacts). Also
          published: \`limn-test\` (drives a UI in a test, with no display),
          \`limn-fonts-all\` (opts
          into the pan-CJK and colour-emoji faces at the versions this release was tested
          with), and \`limn-video-ffmpeg\`, whose FFmpeg payload is the separately versioned
          \`limn-ffmpeg-natives\` artifact: add one of its \`natives-<os>-<arch>\` classifiers
          for your platform, or \`limn-video-ffmpeg-natives-all\` (published here) for a
          bundle that ships everywhere at the payload version this release was tested with.
          The Tabler icon pack, \`limn-icons-tabler\`, versions with Tabler and is released
          from its own repository.

          Nothing to install to see it: the showcase and the theme editor are on Central
          as runnable artifacts, and [jbang](https://www.jbang.dev/download/) starts either
          from its coordinate, fetching only this machine's native libraries.

          \`\`\`bash
          jbang io.github.limn-toolkit:limn-demo:$VERSION
          jbang io.github.limn-toolkit:limn-theme-editor:$VERSION
          \`\`\`

          On macOS add \`--java-options=-XstartOnFirstThread\` before the coordinate; the flag is
          macOS-only. \`jbang --fresh demo@limn-toolkit/limn-toolkit\` and
          \`jbang --fresh theme-editor@limn-toolkit/limn-toolkit\` are the same two at the newest
          release. For a machine with no network, the demo is also attached below as one file
          with every platform inside: \`jbang limn-demo-all.jar\`.

          $CHANGES

          Every release's changes, and what to change in your code when you move:
          [CHANGELOG.md](https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md).

          ---
          NOTES
          )" \
            release-assets/limn-demo-all.jar
          echo "### Drafted $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Two things are staged and neither is public yet:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. The deployment on <https://central.sonatype.com/publishing/deployments> — inspect it, then **Publish** (or **Drop**)." >> "$GITHUB_STEP_SUMMARY"
          echo "2. The draft release on <https://github.com/$GH_REPO/releases> — edit the notes, then publish it." >> "$GITHUB_STEP_SUMMARY"

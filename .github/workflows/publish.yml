# Publishes the library modules to Maven Central, off a tag, and drafts the GitHub release.
#
# The version comes from the tag and from nowhere else: build.gradle.kts reads -PlimnVersion and
# otherwise says -SNAPSHOT, so `v0.1.0` is what makes 0.1.0 exist. Nothing in the tree has to be
# edited to release, and nothing is left saying "0.1.0" after one.
#
# Neither half of a release publishes itself. The upload STOPS at the Portal, where what arrives
# is a deployment, validated and staged, that somebody opens and presses Publish on; the GitHub
# release is created as a DRAFT. Both last steps are manual and belong together: until they
# happen a release can still be dropped, and Central keeps what it accepts — a wrong artifact
# cannot be replaced, only superseded by a version number nobody wanted to spend.
#
# Secrets this needs (repository settings → Secrets and variables → Actions):
#
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   the Portal USER TOKEN, not the login
#   SIGNING_KEY                                       `gpg --armor --export-secret-keys <id>`,
#                                                     BEGIN/END lines included
#   SIGNING_PASSWORD                                  that key's passphrase
#
# The public half of the key has to be on a public keyserver (keyserver.ubuntu.com,
# keys.openpgp.org) before this runs: Central verifies the signature against one, and a key it
# cannot find fails validation after the upload, not before it.

name: publish

on:
  push:
    tags: ["v*"]
  # For a re-run of a release whose upload failed after the tag already existed. It is not a way
  # to release something untagged: the tag is verified below, in both paths.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true
        type: string
      force:
        description: "Upload again even though this version was already uploaded once"
        required: false
        default: false
        type: boolean

# Read-only for the workflow, and widened per JOB rather than here. The job that holds the
# credentials and runs the build gets nothing to write; the job that writes gets no credentials
# and no code. Granting write at this level would hand both to the same job, and that job
# executes the repository's own build.
permissions:
  contents: read

# A release is not something to run twice at once, and unlike the site's, a queued second run is
# not harmless: two uploads of one version race for the same deployment on the Portal.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The version and the tag, checked before six native builds are spent on a typo. It is the
  # cheapest job in the file and everything else waits on it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To ask what this workflow has already done with this tag; see the last step.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full depth, for the tag check below: a shallow clone has the tag object without the
      # commit it points at, which cannot be compared to anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version, from the tag or from the dispatch input, with the leading v removed.
      # Rejected here rather than by Gradle if it is not a version: the tag is a human's typing,
      # and `v0.1` or `0.1.0-SNAPSHOT` should not reach an upload.
      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
            echo "::error::'$VERSION' is not a release version (expected 1.2.3, or 1.2.3-rc1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      # Every published version is a tag, and this is what makes that true rather than customary.
      # On a tag push it passes by construction; on a dispatch it is the whole point, because
      # that trigger otherwise publishes whatever branch it was pointed at and leaves no record
      # of what the artifact was built from. A release nobody can check out is not one anybody
      # can support.
      - name: Verify the tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::$TAG does not exist. Tag the commit you mean to release first."
            exit 1
          fi
          TAGGED="$(git rev-parse "$TAG^{commit}")"
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $TAGGED, not at the commit being built ($GITHUB_SHA)"
            exit 1
          fi
          echo "$TAG is $TAGGED"

      # One upload per version, enforced rather than assumed.
      #
      # Pushing a branch and a tag together makes GitHub emit an event per ref, and it has
      # produced TWO identical publish runs for one tag — created in the same second, the second
      # queued behind the first by the concurrency group. Left alone it would upload 0.2.0 to the
      # Portal a second time, and the person deciding what to release would find two deployments
      # of one version and have to work out which.
      #
      # A SUCCESSFUL earlier run is the signal, which is what makes this safe for the case the
      # dispatch trigger exists for: a run that failed leaves nothing behind, so re-running after
      # a fix still works. Deliberately replacing an upload — after dropping its deployment on the
      # Portal — is what `force` is for.
      - name: Refuse a second upload of the same version
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          PRIOR="$(gh run list --workflow publish.yml --branch "$TAG" --status success \
                     --limit 20 --json url --jq '.[0].url // empty')"
          if [ -n "$PRIOR" ]; then
            echo "::error::$TAG has already been uploaded, by $PRIOR. Nothing was sent this time."
            echo "::error::If that deployment was dropped on the Portal and you mean to replace it, re-run this workflow from the Actions tab with 'force' ticked."
            exit 1
          fi
          echo "no successful publish run for $TAG yet"

  # The decoder's six slices, built here and nowhere else. They are not in the repository and
  # never will be: they exist for the length of this run, go into the jar, and are gone.
  natives:
    needs: verify
    uses: ./.github/workflows/natives.yml

  publish:
    needs: [verify, natives]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      # Full depth, for the tag check below: a shallow clone has the tag object without the
      # commit it points at, which cannot be compared to anything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Must match the toolchain in build.gradle.kts, for the reason that file gives: the
          # Javadoc doclet differs between 17 and 21, and a published javadoc jar is an artifact
          # like any other. What the classes TARGET is 17 either way (options.release).
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The six slices the natives job built, merged back into the one tree the module packages
      # from. `merge-multiple` is what makes six artifacts one directory: each carries the same
      # `limn/video/ffmpeg/native/` shape with a different platform inside it.
      #
      # This is the only moment those binaries exist in a checkout. They are not committed, the
      # tree ignores them, and the jar built below is the only place they are meant to live.
      - name: Fetch the native payload
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-native-*
          merge-multiple: true
          path: limn-video-ffmpeg/native/dist/player

      - name: Check the payload is complete
        run: |
          echo "slices present:"
          ls limn-video-ffmpeg/native/dist/player/limn/video/ffmpeg/native

      # GLFW needs a display and Mesa needs its software rasteriser: llvmpipe provides the
      # OpenGL 3.3 core profile the backend requires, with no GPU on the runner. Same list as
      # site-ci.yml, and for the same reason: trimming it does not fail here, it fails inside a
      # Gradle task where the cause is much harder to read.
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxxf86vm1

      # The whole gate, before the upload, and this is the one workflow where skipping it is not
      # a trade: the PR gate protects a merge, which can be reverted. This protects a publication,
      # which cannot. `check` also builds the javadoc that ships in the jars.
      - name: Gradle check
        run: >-
          xvfb-run -a ./gradlew check
          -PlimnVersion=${{ needs.verify.outputs.version }}
          -PlimnFfmpegProfile=player
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      # ORG_GRADLE_PROJECT_<name> is how a Gradle property arrives from an environment, which is
      # what keeps every one of these out of the repository and out of the command line (a -P
      # would put the passphrase in the process list and in the log).
      - name: Publish to Maven Central
        run: >-
          ./gradlew publishToMavenCentral
          -PlimnVersion=${{ needs.verify.outputs.version }}
          -PlimnFfmpegProfile=player
          --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # The only job in this file that can write to the repository, and deliberately the smallest:
  # no checkout, no build, no secrets, one CLI call. It cannot run anything the tag brought with
  # it, because it never fetches it.
  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          # A re-run after a failed upload finds its own draft from the first attempt. Editing it
          # would overwrite notes somebody may have already written by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release already exists for $TAG; leaving it untouched"
            exit 0
          fi
          # --notes is PREPENDED to what --generate-notes produces, so the coordinates lead and
          # the commit list follows.
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            --notes "$(cat <<NOTES
          Published to Maven Central as \`io.github.limn-toolkit\`.

          \`\`\`kotlin
          dependencies {
              implementation("io.github.limn-toolkit:limn-backend-lwjgl:$VERSION")
          }
          \`\`\`

          That one line brings \`limn-toolkit\` with it. Also published:
          \`limn-icons-tabler\`, \`limn-theme-editor\`, and \`limn-video-ffmpeg\` with one
          \`natives-<os>-<arch>\` classifier per desktop target plus \`natives-all\`.

          ---
          NOTES
          )"
          echo "### Drafted $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Two things are staged and neither is public yet:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. The deployment on <https://central.sonatype.com/publishing/deployments> — inspect it, then **Publish** (or **Drop**)." >> "$GITHUB_STEP_SUMMARY"
          echo "2. The draft release on <https://github.com/$GH_REPO/releases> — edit the notes, then publish it." >> "$GITHUB_STEP_SUMMARY"

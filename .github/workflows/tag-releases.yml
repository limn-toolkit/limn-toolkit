# Turns versions.properties into a release, on every push to main, so nobody types a tag or
# pushes one: landing a bumped entry on main IS the decision — and nothing else changes for it.
#
# No file carries the version but that one. The documentation writes placeholders (`x.y.z` in
# the READMEs, `{{version}}` in the guides, which the site fills in at deploy time from the
# release it documents), so a release commits nothing: scripts/check-versions.sh refuses any
# literal, here and again in publish's verify job.
#
# If `v<version>` is not on origin yet, this job creates it at the pushed commit and starts the
# publish run explicitly — a ref pushed with the workflow's own GITHUB_TOKEN wakes no other
# workflow (GitHub's recursion guard; workflow_dispatch is the exception). Entries already tagged
# are left alone, so the workflow is idempotent. What stays human: Publish on the Central
# Portal, and the drafted GitHub release, which is what deploys the site.

name: tag-releases

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release what versions.properties asks for
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(sed -n 's/^limn-toolkit[[:space:]]*=[[:space:]]*//p' versions.properties | tr -d '[:space:]')"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "· $TAG already on origin (bump versions.properties for a new release)"
            exit 0
          fi
          # The same expression publish accepts, so a typo stops here and not after a build.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
            echo "::error::'$VERSION' in versions.properties is not a release version (expected 1.2.3, or 1.2.3-rc1)"
            exit 1
          fi

          # The documentation must name no version: a literal would be a file to edit per release.
          bash scripts/check-versions.sh

          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

          # The publish, started by hand because the token's own push cannot start it.
          gh workflow run publish.yml --ref "$TAG" -f version="$VERSION"
          echo "✚ $TAG created at $(git rev-parse HEAD); publish dispatched"
          {
            echo "### Tagged and dispatched $TAG"
            echo ""
            echo "publish runs the full check, uploads, and stages a deployment on <https://central.sonatype.com/publishing/deployments> and a draft release; both wait for a human. No commit was made: the documentation carries placeholders."
          } >> "$GITHUB_STEP_SUMMARY"

# Publishes the site to GitHub Pages when a release is published, or on demand.
#
# NOT on every push to main, which is what this used to do. The site is generated from this
# repository's own sources — Javadoc, theme tokens, a gallery captured from a real build — so a
# push deploy means a full Gradle build, an xvfb session and a screenshot run for a typo in a
# comment. During the stretch where the project changes constantly and the site changes rarely,
# that is most of the CI budget spent on rebuilding an identical page.
#
# `release: published` is also the honest moment. The site documents coordinates a reader is
# meant to copy, and until the deployment is published on the Portal those coordinates resolve to
# nothing. Publishing the GitHub release IS the human's last step of a release (see
# publish.yml), so the page goes live exactly when what it describes does — which is why the
# documentation for a version belongs in the commit that gets tagged, rather than in a follow-up.
#
# workflow_dispatch is the other half: a fix to the prose, a broken link, a screenshot that
# needs retaking, none of which should wait for a version.
#
# Build and deploy are separate jobs because that is actions/deploy-pages' contract: the
# build job uploads a Pages artifact, the deploy job turns it into a deployment. Merging
# them into one job silently skips the deployment environment's protection rules.
#
# One-time setup when this repository first gets a remote: in the repository settings,
# set Pages to deploy from GitHub Actions. Until then actions/configure-pages fails with
# instructions rather than deploying anywhere.

name: site-deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialises deploys so two merges cannot race: later runs queue behind the live one.
# `cancel-in-progress` stays false: cancelling a deployment mid-flight can leave the
# published site half-updated, which is worse than publishing twice in a row.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Whether this release is the one the site should show. A release event is not enough on its
  # own: publishing a maintenance release of an older line is a normal thing to do, and it must
  # not roll the site back to that line's documentation, which is exactly what deploying its tag
  # would do. The site follows the NEWEST version and nothing else.
  #
  # Highest published version wins, computed here rather than taken from GitHub's own "latest"
  # flag: that flag is decided by tag creation date, so a 0.1.4 tagged today would claim it while
  # 0.2.0 sits above it. `sort -V` compares the numbers, which is the question actually being
  # asked. Prereleases and drafts are excluded, and a manual run always proceeds — a person
  # dispatching this has already decided.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Is this the newest release?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "manual run: deploying whatever was chosen"
            exit 0
          fi
          NEWEST="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
                      --json tagName --jq '.[].tagName' \
                    | sed 's/^v//' | sort -V | tail -1)"
          THIS="${TAG#v}"
          echo "this release: $THIS   newest published: $NEWEST"
          if [ "$THIS" = "$NEWEST" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest release ($NEWEST); the site stays where it is."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The ref is spelled out rather than left to the event's default, which is not the same
      # thing for the two triggers here and is not obvious for either. A release deploys the
      # TAG's tree: the site then describes the version that was just published, and not
      # whatever main has drifted to since. A manual run deploys whatever branch or tag the
      # person picked in the UI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Temurin 17, because the build itself targets 17: every module compiles with
      # `options.release.set(17)` and the aggregate Javadoc links the Java 17 API.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must match the toolchain in build.gradle.kts: the Javadoc doclet
          # differs between 17 and 21 and /api/ is themed against 21.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # GLFW needs a display and Mesa needs its software rasteriser: llvmpipe provides
      # the OpenGL 3.3 core profile the backend requires, with no GPU on the runner.
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 \
            libxcursor1 libxi6 libxxf86vm1

      # The three generators, in the order the site build consumes them. `check` is not
      # run here: the PR workflow is the gate, and a deploy that re-runs the whole test
      # suite is a deploy that a flaky test can veto after the merge already happened.
      - name: Export theme tokens
        run: ./gradlew :limn-demo:exportThemeTokens

      - name: Aggregate Javadoc
        run: ./gradlew aggregateJavadoc

      - name: Capture the component gallery
        run: xvfb-run -a ./gradlew :limn-demo:captureGallery
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      # pnpm before setup-node: setup-node's `cache: pnpm` shells out to pnpm to locate
      # the store, so reversing these two steps fails the cache setup. The version comes
      # from `packageManager` in site/package.json and from nowhere else.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # The origin and base path come from the Pages configuration itself and from
      # nowhere else: a default project site serves under /<repo>/, a custom domain
      # under /. Writing a hostname or a path into this file breaks every asset URL the
      # moment the site moves, which is why no hostname appears anywhere in .github/.
      # See docs/design/website.md, "Invariants".
      # `base_path` is empty on a custom domain, hence the fallback to "/".
      - name: Build the site
        run: pnpm build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
          REPO_SLUG: ${{ github.repository }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

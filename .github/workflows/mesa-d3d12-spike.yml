# Spike, not CI: how large is a Mesa build that carries only the d3d12 driver (OpenGL over
# Direct3D 12, the driver behind Windows' own OpenGL compatibility pack), and does the published
# demo draw through it on a Windows runner, which has no GPU and no OpenGL driver of its own?
#
# Runs on a push to this branch alone. Each run is a result rather than a gate: spike\run.ps1
# records exit codes and logs, and the job uploads them with the built libraries.
name: mesa-d3d12-spike

on:
  push:
    branches: [spike/mesa-d3d12-runner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x64, java: temurin, java-arch: x64 }
          - { runner: windows-11-arm, arch: arm64, java: microsoft, java-arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      MESA_TAG: mesa-26.2.5
      DXC_TAG: v1.9.2609
      WINFLEXBISON_TAG: v2.5.25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The machine
        run: |
          New-Item -ItemType Directory results | Out-Null
          & {
            "session=" + [System.Diagnostics.Process]::GetCurrentProcess().SessionId
            "interactive=" + [Environment]::UserInteractive
            "os=" + [Environment]::OSVersion.VersionString
            "arch=" + $env:PROCESSOR_ARCHITECTURE
            "cpus=" + [Environment]::ProcessorCount
            Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterCompatibility, VideoProcessor | Out-String
            Get-ChildItem C:\Windows\System32\OpenGLOn12.dll, C:\Windows\System32\d3d12.dll -ErrorAction SilentlyContinue | Format-Table Name, Length, VersionInfo | Out-String
          } | Tee-Object results\machine.txt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.java }}
          java-version: '17'
          architecture: ${{ matrix.java-arch }}

      - name: Build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check meson ninja mako packaging pyyaml
          gh release download $env:WINFLEXBISON_TAG --repo lexxmark/winflexbison --pattern 'win_flex_bison-*.zip' --dir tools
          Get-ChildItem tools\win_flex_bison-*.zip | Expand-Archive -DestinationPath tools\winflexbison
          "$PWD\tools\winflexbison" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          gh release download $env:DXC_TAG --repo microsoft/DirectXShaderCompiler --pattern 'dxc_*.zip' --dir tools
          Get-ChildItem tools\dxc_*.zip | Expand-Archive -DestinationPath tools\dxc
          iex "& { $(iwr -useb https://ps.jbang.dev) } app setup"
          "$env:USERPROFILE\.jbang\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          "VSINSTALL=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Fetch Mesa
        run: git clone --depth 1 --branch $env:MESA_TAG https://gitlab.freedesktop.org/mesa/mesa.git mesa

      # Mesa's own Windows CI options (.gitlab-ci/windows/mesa_build.ps1) with everything but the
      # d3d12 OpenGL driver turned off: no LLVM (so no llvmpipe), no Vulkan, no video, no GLES,
      # no EGL, no OpenCL. The CRT is linked statically (b_vscrt=mt), as Mesa's CI does, so the
      # libraries need no Visual C++ redistributable on the machine they land on.
      - name: Build Mesa, d3d12 only
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1
          meson setup _build mesa --default-library=shared --buildtype=release -Db_ndebug=true -Db_vscrt=mt --prefix=%CD%\_install -Dplatforms=windows -Dllvm=disabled -Dvulkan-drivers=[] -Dgallium-drivers=d3d12 -Dgallium-va=disabled -Dgallium-d3d10umd=false -Dgallium-mediafoundation=disabled -Dgallium-d3d12-video=disabled -Dvideo-codecs=[] -Dgles1=disabled -Dgles2=disabled -Degl=disabled -Dgbm=disabled -Dglx=disabled -Dmicrosoft-clc=disabled -Dspirv-to-dxil=false -Dgallium-rusticl=false -Dbuild-tests=false -Dwerror=false || exit /b 1
          meson install -C _build || exit /b 1

      - name: What the libraries import
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }} || exit /b 1
          dir /s /b _install > results\install-tree.txt
          for %%f in (_install\bin\*.dll) do dumpbin /nologo /dependents %%f >> results\dependents.txt
          for /r tools\dxc %%f in (dxil.dll) do if exist "%%f" dumpbin /nologo /dependents "%%f" >> results\dependents.txt
          type results\install-tree.txt
          type results\dependents.txt

      - name: Sizes
        run: |
          New-Item -ItemType Directory stage\mesa-nodxil, stage\mesa-dxil -Force | Out-Null
          Copy-Item _install\bin\*.dll stage\mesa-nodxil
          Copy-Item _install\bin\*.dll stage\mesa-dxil
          $dxil = Get-ChildItem tools\dxc -Recurse -Filter dxil.dll |
              Where-Object { $_.FullName -match '\\${{ matrix.arch }}\\' } | Select-Object -First 1
          Copy-Item $dxil.FullName stage\mesa-dxil
          Get-ChildItem tools\dxc -Recurse -Include LICENSE*, *.txt | Copy-Item -Destination results
          Compress-Archive stage\mesa-nodxil\*.dll results\mesa-nodxil.zip -CompressionLevel Optimal
          Compress-Archive stage\mesa-dxil\*.dll results\mesa-dxil.zip -CompressionLevel Optimal
          & {
            "Mesa $env:MESA_TAG, d3d12 only, windows-${{ matrix.arch }}; dxil.dll from DXC $env:DXC_TAG"
            Get-ChildItem stage\mesa-dxil\*.dll | ForEach-Object { "{0,-22} {1,12:N0} bytes" -f $_.Name, $_.Length }
            "{0,-22} {1,12:N0} bytes" -f "raw, Mesa only", (Get-ChildItem stage\mesa-nodxil\*.dll | Measure-Object Length -Sum).Sum
            "{0,-22} {1,12:N0} bytes" -f "raw, with dxil.dll", (Get-ChildItem stage\mesa-dxil\*.dll | Measure-Object Length -Sum).Sum
            "{0,-22} {1,12:N0} bytes" -f "zip, Mesa only", (Get-Item results\mesa-nodxil.zip).Length
            "{0,-22} {1,12:N0} bytes" -f "zip, with dxil.dll", (Get-Item results\mesa-dxil.zip).Length
          } | Tee-Object results\sizes.txt

      - name: Resolve the demo once
        run: jbang build spike\Probe.java

      # The control: the machine's own opengl32.dll, which on a machine with no vendor driver is
      # GDI Generic 1.1 and refuses Limn's 3.3 core context.
      - name: Control, the machine's own OpenGL
        run: .\spike\run.ps1 control-gl-info "" 180 -- --gl-info

      - name: Mesa without dxil.dll, context
        run: .\spike\run.ps1 nodxil-gl-info "$PWD\stage\mesa-nodxil" 180 -- --gl-info

      # A context needs no shader; drawing does, and the d3d12 driver signs each shader with
      # dxil.dll. Whether this Windows accepts them unsigned is the question this run answers.
      - name: Mesa without dxil.dll, drawing
        run: .\spike\run.ps1 nodxil-kitchen "$PWD\stage\mesa-nodxil" 240 -- --screenshot results\nodxil-kitchen.png --scene kitchen-light

      - name: Mesa with dxil.dll, context
        env:
          JAVA_TOOL_OPTIONS: -Dorg.lwjgl.util.Debug=true -Dorg.lwjgl.util.DebugLoader=true
        run: .\spike\run.ps1 dxil-gl-info "$PWD\stage\mesa-dxil" 180 -- --gl-info

      - name: Mesa with dxil.dll, drawing
        run: |
          .\spike\run.ps1 dxil-kitchen "$PWD\stage\mesa-dxil" 240 -- --screenshot results\dxil-kitchen.png --scene kitchen-light
          .\spike\run.ps1 dxil-charts "$PWD\stage\mesa-dxil" 240 -- --screenshot results\dxil-charts.png --scene charts-light
          .\spike\run.ps1 dxil-viewport3d "$PWD\stage\mesa-dxil" 240 -- --screenshot results\dxil-viewport3d.png --scene viewport3d-light
          .\spike\run.ps1 dxil-shadows "$PWD\stage\mesa-dxil" 240 -- --screenshot results\dxil-shadows.png --scene shadows

      # The heavy-screen benchmark in a visible window, and its Swing twin on the same machine:
      # the same layout, phases and metrics, drawn by Java2D instead.
      - name: Benchmarks
        run: |
          .\spike\run.ps1 dxil-bench "$PWD\stage\mesa-dxil" 300 -- --bench on
          .\spike\run.ps1 swing-bench "" 300 -- java scripts\bench\SwingBench.java

      - name: Summary
        if: always()
        run: |
          & {
            "## windows-${{ matrix.arch }}"
            '```'
            Get-Content results\machine.txt -ErrorAction SilentlyContinue
            Get-Content results\sizes.txt -ErrorAction SilentlyContinue
            ""
            Get-Content results\runs.txt -ErrorAction SilentlyContinue
            ""
            Get-ChildItem results\*-gl-info.log -ErrorAction SilentlyContinue | ForEach-Object {
              "--- $($_.Name)"
              Get-Content $_ | Where-Object { $_ -notmatch '^\[LWJGL\]' } | Select-Object -Last 25
            }
            ""
            Get-ChildItem results\*bench.log -ErrorAction SilentlyContinue | ForEach-Object {
              "--- $($_.Name)"
              Get-Content $_ | Where-Object { $_ -match '^BENCH' }
            }
            '```'
          } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mesa-d3d12-${{ matrix.arch }}
          path: |
            results/
            stage/
          retention-days: 14

# Colour picker: Français (fr)
# UTF-8. Keys not listed here fall back to the English the component declares.
# See docs/design/i18n.md for which locales the text pipeline can currently draw.

# French is the one language in this set that renames the notations themselves.
# Every other shipped language keeps RGB/HSV/CMYK and its channel letters, so it
# has no file here and falls back to the English the component declares.
limn.colorPicker.format.rgb=RVB
limn.colorPicker.format.hsv=TSV
limn.colorPicker.format.cmyk=CMJN
limn.colorPicker.channel.r=R
limn.colorPicker.channel.g=V
limn.colorPicker.channel.b=B
limn.colorPicker.channel.h=T
limn.colorPicker.channel.s=S
limn.colorPicker.channel.v=V
limn.colorPicker.channel.c=C
limn.colorPicker.channel.m=M
limn.colorPicker.channel.y=J
limn.colorPicker.channel.k=N
limn.colorPicker.channel.alpha=A

# The hue ramp names nothing on screen: it is read out and never looked at, so it
# carries the channel's whole word where the rail beside it carries the letter. The
# letter above is already T for this word, which is why the two must not collide.
limn.colorPicker.hue=Teinte

# The saturation/value plane and its two axes name nothing on screen either: they are read
# out and never looked at, so they carry the channels' whole words where the rails beside
# them carry the letters. Saturation is the same word in French and falls back to the
# English the component declares; Valeur is the word this notation is called TSV after,
# which is why the letter above is V for it and must not collide with this one.
limn.colorPicker.field=Saturation et valeur
limn.colorPicker.axis.value=Valeur

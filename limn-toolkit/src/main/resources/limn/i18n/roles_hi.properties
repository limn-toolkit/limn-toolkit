# The phrase a screen reader speaks after a node's name, in this language.
#
# A key missing here falls back to the English in RoleNames, which is a reader saying
# "button" in the wrong language rather than saying nothing. No two roles may share a
# phrase within one language: that would describe two different controls identically,
# and RoleNamesTest refuses it -- pt-PT is why, where "separador" is the natural word
# for both a separator and a tab.


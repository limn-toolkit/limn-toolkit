# Colour picker: Tiếng Việt (vi)
# UTF-8. Keys not listed here fall back to the English the component declares.
# See docs/design/i18n.md for which locales the text pipeline can currently draw.

# The notations and their channel letters are symbols, read as written, and are not
# listed: this language keeps RGB, HSV and CMYK and the letters R, G, B, H, S, V, C,
# M, Y, K and A, so they fall back to the English the component declares. French is
# the one shipped language that renames them (see colorpicker_fr).

# What a screen reader calls the parts of the picker that name nothing on screen.
# The hex field is named after its notation rather than after the "#" beside it.
# Hex is the abbreviation this language reads as written, as French does.
limn.colorPicker.hex=Hex

# The hue ramp carries the channel's whole word where the HSV rail beside it carries
# the letter H, so the two must not be the same text.
limn.colorPicker.hue=Sắc độ

# The saturation/value plane and its two axes, again whole words where the rails
# beside them carry the letters S and V.
limn.colorPicker.field=Độ bão hòa và độ sáng
limn.colorPicker.axis.saturation=Độ bão hòa
limn.colorPicker.axis.value=Độ sáng

# The before/after swatch: {0} is the colour now and {1} the one the picker opened
# on, both already written as hex. Either may come first.
limn.colorPicker.swatch=Màu {0}, trước đó {1}

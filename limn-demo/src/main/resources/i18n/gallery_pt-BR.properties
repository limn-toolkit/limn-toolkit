# The accessibility gallery's reader entries: Português (Brasil) (pt-BR).
# UTF-8. Decision 68 of the 2026-09-13 pass: a reader pass speaks one language, and the guests'
# reader language is pt-BR (decision 65). English is what GalleryStrings' constants carry, so this
# is the only file of the family; the entries' data (the table's ranges, the tree's files) is not
# translated and is not here.


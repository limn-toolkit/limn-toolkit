# Driver help: Polski (pl)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Ten komputer nie ma sterownika grafiki, którego aplikacja mogłaby użyć
limn.driverHelp.body=Aplikacja wymaga OpenGL 3.3, a system Windows nie znalazł sterownika, który go zapewnia. Dzieje się tak w maszynach wirtualnych, w sesjach pulpitu zdalnego oraz na kartach graficznych, których sterownik obsługuje tylko Direct3D.\n\nJeśli komputer ma kartę graficzną, zainstaluj lub zaktualizuj sterownik producenta. W przeciwnym razie zainstaluj bezpłatny pakiet zgodności firmy Microsoft, a potem ponownie otwórz aplikację.
limn.driverHelp.store=Otwórz Microsoft Store
limn.driverHelp.storeNote=Zainstaluj bezpłatny pakiet „OpenCL, OpenGL, and Vulkan Compatibility Pack”
limn.driverHelp.winget=Zainstaluj za pomocą winget
limn.driverHelp.wingetNote=Otwiera okno wiersza polecenia, które uruchamia:
limn.driverHelp.askStore=Otworzyć Microsoft Store, aby teraz zainstalować bezpłatny pakiet „OpenCL, OpenGL, and Vulkan Compatibility Pack”?

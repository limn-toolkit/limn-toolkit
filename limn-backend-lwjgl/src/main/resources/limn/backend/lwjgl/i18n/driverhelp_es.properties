# Driver help: Español (es)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Este equipo no tiene un controlador gráfico que la aplicación pueda usar
limn.driverHelp.body=La aplicación necesita OpenGL 3.3 y Windows no encontró ningún controlador que lo ofrezca. Esto ocurre en máquinas virtuales, en sesiones de escritorio remoto y en tarjetas gráficas cuyo controlador solo ofrece Direct3D.\n\nSi el equipo tiene tarjeta gráfica, instale o actualice el controlador del fabricante. Si no, instale el paquete de compatibilidad gratuito de Microsoft y vuelva a abrir la aplicación.
limn.driverHelp.store=Abrir Microsoft Store
limn.driverHelp.storeNote=Instalar el paquete gratuito «OpenCL, OpenGL, and Vulkan Compatibility Pack»
limn.driverHelp.winget=Instalar con winget
limn.driverHelp.wingetNote=Abre una ventana de comandos que ejecuta:
limn.driverHelp.askStore=¿Abrir Microsoft Store para instalar ahora el paquete gratuito «OpenCL, OpenGL, and Vulkan Compatibility Pack»?

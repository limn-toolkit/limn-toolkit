# Driver help: Français (fr)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Cet ordinateur n’a aucun pilote graphique utilisable par l’application
limn.driverHelp.body=L’application a besoin d’OpenGL 3.3, et Windows n’a trouvé aucun pilote qui le fournisse. Cela arrive dans les machines virtuelles, dans les sessions Bureau à distance et avec les cartes graphiques dont le pilote ne propose que Direct3D.\n\nSi l’ordinateur a une carte graphique, installez ou mettez à jour le pilote de son fabricant. Sinon, installez le pack de compatibilité gratuit de Microsoft, puis rouvrez l’application.
limn.driverHelp.store=Ouvrir le Microsoft Store
limn.driverHelp.storeNote=Installer le pack gratuit « OpenCL, OpenGL, and Vulkan Compatibility Pack »
limn.driverHelp.winget=Installer avec winget
limn.driverHelp.wingetNote=Ouvre une fenêtre de commande qui exécute :
limn.driverHelp.askStore=Ouvrir le Microsoft Store pour installer maintenant le pack gratuit « OpenCL, OpenGL, and Vulkan Compatibility Pack » ?

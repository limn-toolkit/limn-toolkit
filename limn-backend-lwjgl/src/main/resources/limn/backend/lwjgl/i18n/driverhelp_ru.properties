limn.driverHelp.heading=На этом компьютере нет графического драйвера, который может использовать приложение
limn.driverHelp.body=Приложению нужен OpenGL 3.3, а Windows не нашла драйвер, который его поддерживает. Так бывает в виртуальных машинах, в сеансах удалённого рабочего стола и на видеокартах, драйвер которых поддерживает только Direct3D.\n\nЕсли в компьютере есть видеокарта, установите или обновите драйвер её производителя. В противном случае установите бесплатный пакет совместимости от Microsoft и снова откройте приложение.
limn.driverHelp.store=Открыть Microsoft Store
limn.driverHelp.storeNote=Установить бесплатный пакет «OpenCL, OpenGL, and Vulkan Compatibility Pack»
limn.driverHelp.winget=Установить с помощью winget
limn.driverHelp.wingetNote=Открывает окно командной строки, в котором выполняется:
limn.driverHelp.askStore=Открыть Microsoft Store, чтобы установить бесплатный пакет «OpenCL, OpenGL, and Vulkan Compatibility Pack» сейчас?

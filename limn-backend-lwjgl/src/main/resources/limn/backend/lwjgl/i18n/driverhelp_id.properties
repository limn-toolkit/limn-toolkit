# Driver help: Bahasa Indonesia (id)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Komputer ini tidak memiliki driver grafis yang dapat digunakan aplikasi
limn.driverHelp.body=Aplikasi memerlukan OpenGL 3.3, dan Windows tidak menemukan driver yang menyediakannya. Hal ini terjadi di mesin virtual, di sesi desktop jarak jauh, dan pada kartu grafis yang driver-nya hanya menawarkan Direct3D.\n\nJika komputer memiliki kartu grafis, instal atau perbarui driver dari produsennya. Jika tidak, instal paket kompatibilitas gratis dari Microsoft, lalu buka kembali aplikasi.
limn.driverHelp.store=Buka Microsoft Store
limn.driverHelp.storeNote=Instal “OpenCL, OpenGL, and Vulkan Compatibility Pack” yang gratis
limn.driverHelp.winget=Instal dengan winget
limn.driverHelp.wingetNote=Membuka jendela perintah yang menjalankan:
limn.driverHelp.askStore=Buka Microsoft Store untuk menginstal “OpenCL, OpenGL, and Vulkan Compatibility Pack” yang gratis sekarang?

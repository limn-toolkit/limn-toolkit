limn.driverHelp.heading=このコンピューターには、アプリケーションが使用できるグラフィックス ドライバーがありません
limn.driverHelp.body=このアプリケーションには OpenGL 3.3 が必要ですが、Windows はそれを提供するドライバーを見つけられませんでした。これは仮想マシン、リモート デスクトップ セッション、および Direct3D のみに対応したドライバーのグラフィックス カードで起こります。\n\nコンピューターにグラフィックス カードがある場合は、メーカーのドライバーをインストールまたは更新してください。そうでない場合は、Microsoft の無料の互換性パックをインストールしてから、アプリケーションをもう一度開いてください。
limn.driverHelp.store=Microsoft Store を開く
limn.driverHelp.storeNote=無料の「OpenCL, OpenGL, and Vulkan Compatibility Pack」をインストールします
limn.driverHelp.winget=winget でインストール
limn.driverHelp.wingetNote=次のコマンドを実行するコマンド ウィンドウを開きます:
limn.driverHelp.askStore=Microsoft Store を開いて、無料の「OpenCL, OpenGL, and Vulkan Compatibility Pack」を今すぐインストールしますか?

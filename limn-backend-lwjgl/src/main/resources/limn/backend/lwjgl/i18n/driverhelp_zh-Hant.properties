limn.driverHelp.heading=這部電腦沒有應用程式可以使用的圖形驅動程式
limn.driverHelp.body=應用程式需要 OpenGL 3.3，但 Windows 找不到提供它的驅動程式。這種情況會發生在虛擬機器、遠端桌面工作階段，以及驅動程式只提供 Direct3D 的顯示卡上。\n\n如果電腦有顯示卡，請安裝或更新顯示卡製造商的驅動程式。否則，請安裝 Microsoft 的免費相容性套件，然後重新開啟應用程式。
limn.driverHelp.store=開啟 Microsoft Store
limn.driverHelp.storeNote=安裝免費的「OpenCL, OpenGL, and Vulkan Compatibility Pack」
limn.driverHelp.winget=使用 winget 安裝
limn.driverHelp.wingetNote=開啟命令視窗並執行：
limn.driverHelp.askStore=要立即開啟 Microsoft Store 安裝免費的「OpenCL, OpenGL, and Vulkan Compatibility Pack」嗎？

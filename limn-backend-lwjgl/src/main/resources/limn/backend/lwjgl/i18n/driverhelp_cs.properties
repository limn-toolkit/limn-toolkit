# Driver help: Čeština (cs)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Tento počítač nemá grafický ovladač, který by aplikace mohla použít
limn.driverHelp.body=Aplikace potřebuje OpenGL 3.3 a systém Windows nenašel žádný ovladač, který by ho poskytoval. Stává se to ve virtuálních počítačích, v relacích vzdálené plochy a u grafických karet, jejichž ovladač nabízí jen Direct3D.\n\nPokud má počítač grafickou kartu, nainstalujte nebo aktualizujte ovladač od jejího výrobce. Jinak nainstalujte bezplatný balíček kompatibility od Microsoftu a aplikaci otevřete znovu.
limn.driverHelp.store=Otevřít Microsoft Store
limn.driverHelp.storeNote=Nainstalovat bezplatný balíček „OpenCL, OpenGL, and Vulkan Compatibility Pack“
limn.driverHelp.winget=Nainstalovat pomocí winget
limn.driverHelp.wingetNote=Otevře příkazové okno, které spustí:
limn.driverHelp.askStore=Otevřít Microsoft Store a nainstalovat teď bezplatný balíček „OpenCL, OpenGL, and Vulkan Compatibility Pack“?

# Driver help: Tiếng Việt (vi)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Máy tính này không có trình điều khiển đồ họa mà ứng dụng có thể sử dụng
limn.driverHelp.body=Ứng dụng cần OpenGL 3.3, và Windows không tìm thấy trình điều khiển nào cung cấp nó. Điều này xảy ra trên máy ảo, trong phiên máy tính từ xa và trên card đồ họa có trình điều khiển chỉ hỗ trợ Direct3D.\n\nNếu máy tính có card đồ họa, hãy cài đặt hoặc cập nhật trình điều khiển của nhà sản xuất. Nếu không, hãy cài đặt gói tương thích miễn phí của Microsoft rồi mở lại ứng dụng.
limn.driverHelp.store=Mở Microsoft Store
limn.driverHelp.storeNote=Cài đặt gói miễn phí “OpenCL, OpenGL, and Vulkan Compatibility Pack”
limn.driverHelp.winget=Cài đặt bằng winget
limn.driverHelp.wingetNote=Mở cửa sổ lệnh để chạy:
limn.driverHelp.askStore=Mở Microsoft Store để cài đặt gói miễn phí “OpenCL, OpenGL, and Vulkan Compatibility Pack” ngay bây giờ?

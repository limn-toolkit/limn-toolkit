# Driver help: עברית (he)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=במחשב הזה אין מנהל התקן גרפי שהיישום יכול להשתמש בו
limn.driverHelp.body=היישום צריך OpenGL 3.3, ו-Windows לא מצא מנהל התקן שמספק אותו. זה קורה במכונות וירטואליות, בהפעלות של שולחן עבודה מרוחק ובכרטיסי מסך שמנהל ההתקן שלהם מציע רק Direct3D.\n\nאם יש במחשב כרטיס מסך, יש להתקין או לעדכן את מנהל ההתקן של היצרן. אחרת, יש להתקין את חבילת התאימות החינמית של Microsoft ולפתוח את היישום שוב.
limn.driverHelp.store=פתיחת Microsoft Store
limn.driverHelp.storeNote=התקנת החבילה החינמית "OpenCL, OpenGL, and Vulkan Compatibility Pack"
limn.driverHelp.winget=התקנה באמצעות winget
limn.driverHelp.wingetNote=פותח חלון פקודה שמריץ:
limn.driverHelp.askStore=לפתוח את Microsoft Store כדי להתקין עכשיו את החבילה החינמית "OpenCL, OpenGL, and Vulkan Compatibility Pack"?

# Driver help: 한국어 (ko)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=이 컴퓨터에는 애플리케이션이 사용할 수 있는 그래픽 드라이버가 없습니다
limn.driverHelp.body=애플리케이션에 OpenGL 3.3이 필요하지만 Windows에서 이를 제공하는 드라이버를 찾지 못했습니다. 이 문제는 가상 머신, 원격 데스크톱 세션, 그리고 드라이버가 Direct3D만 지원하는 그래픽 카드에서 발생합니다.\n\n컴퓨터에 그래픽 카드가 있으면 제조업체의 드라이버를 설치하거나 업데이트하세요. 그렇지 않으면 Microsoft의 무료 호환성 팩을 설치한 다음 애플리케이션을 다시 여세요.
limn.driverHelp.store=Microsoft Store 열기
limn.driverHelp.storeNote=무료 ‘OpenCL, OpenGL, and Vulkan Compatibility Pack’ 설치
limn.driverHelp.winget=winget으로 설치
limn.driverHelp.wingetNote=다음을 실행하는 명령 창을 엽니다:
limn.driverHelp.askStore=지금 Microsoft Store를 열어 무료 ‘OpenCL, OpenGL, and Vulkan Compatibility Pack’을(를) 설치하시겠습니까?

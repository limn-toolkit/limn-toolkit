limn.driverHelp.heading=Este computador não tem um driver gráfico que o aplicativo possa usar
limn.driverHelp.body=O aplicativo precisa do OpenGL 3.3, e o Windows não encontrou um driver que o ofereça. Isso acontece em máquinas virtuais, em sessões de área de trabalho remota e em placas de vídeo cujo driver só oferece Direct3D.\n\nSe o computador tem placa de vídeo, instale ou atualize o driver do fabricante. Caso contrário, instale o pacote de compatibilidade gratuito da Microsoft e abra o aplicativo de novo.
limn.driverHelp.store=Abrir a Microsoft Store
limn.driverHelp.storeNote=Instalar o “OpenCL, OpenGL, and Vulkan Compatibility Pack”, gratuito
limn.driverHelp.winget=Instalar com o winget
limn.driverHelp.wingetNote=Abre uma janela de comando que executa:
limn.driverHelp.askStore=Abrir a Microsoft Store para instalar agora o “OpenCL, OpenGL, and Vulkan Compatibility Pack”, gratuito?

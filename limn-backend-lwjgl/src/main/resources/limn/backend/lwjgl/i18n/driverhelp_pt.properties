limn.driverHelp.heading=Este computador não tem um controlador gráfico que a aplicação possa utilizar
limn.driverHelp.body=A aplicação precisa do OpenGL 3.3 e o Windows não encontrou nenhum controlador que o disponibilize. Isto acontece em máquinas virtuais, em sessões de ambiente de trabalho remoto e em placas gráficas cujo controlador só oferece Direct3D.\n\nSe o computador tiver placa gráfica, instale ou atualize o controlador do fabricante. Caso contrário, instale o pacote de compatibilidade gratuito da Microsoft e volte a abrir a aplicação.
limn.driverHelp.store=Abrir a Microsoft Store
limn.driverHelp.storeNote=Instalar o “OpenCL, OpenGL, and Vulkan Compatibility Pack”, gratuito
limn.driverHelp.winget=Instalar com o winget
limn.driverHelp.wingetNote=Abre uma janela de comandos que executa:
limn.driverHelp.askStore=Abrir a Microsoft Store para instalar agora o “OpenCL, OpenGL, and Vulkan Compatibility Pack”, gratuito?

limn.driverHelp.heading=Questo computer non ha un driver grafico utilizzabile dall’applicazione
limn.driverHelp.body=L’applicazione richiede OpenGL 3.3 e Windows non ha trovato alcun driver che lo fornisca. Succede nelle macchine virtuali, nelle sessioni di Desktop remoto e con le schede grafiche il cui driver offre solo Direct3D.\n\nSe il computer ha una scheda grafica, installa o aggiorna il driver del produttore. Altrimenti installa il pacchetto di compatibilità gratuito di Microsoft e riapri l’applicazione.
limn.driverHelp.store=Apri Microsoft Store
limn.driverHelp.storeNote=Installa il pacchetto gratuito «OpenCL, OpenGL, and Vulkan Compatibility Pack»
limn.driverHelp.winget=Installa con winget
limn.driverHelp.wingetNote=Apre una finestra dei comandi che esegue:
limn.driverHelp.askStore=Aprire Microsoft Store per installare ora il pacchetto gratuito «OpenCL, OpenGL, and Vulkan Compatibility Pack»?

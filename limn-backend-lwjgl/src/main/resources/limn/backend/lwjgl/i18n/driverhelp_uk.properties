# Driver help: Українська (uk)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=На цьому комп’ютері немає графічного драйвера, який може використовувати застосунок
limn.driverHelp.body=Застосунку потрібен OpenGL 3.3, а Windows не знайшла драйвера, який його підтримує. Так буває у віртуальних машинах, у сеансах віддаленого робочого стола та на відеокартах, драйвер яких підтримує лише Direct3D.\n\nЯкщо в комп’ютері є відеокарта, установіть або оновіть драйвер її виробника. Інакше встановіть безкоштовний пакет сумісності від Microsoft і знову відкрийте застосунок.
limn.driverHelp.store=Відкрити Microsoft Store
limn.driverHelp.storeNote=Установити безкоштовний пакет «OpenCL, OpenGL, and Vulkan Compatibility Pack»
limn.driverHelp.winget=Установити за допомогою winget
limn.driverHelp.wingetNote=Відкриває вікно командного рядка, у якому виконується:
limn.driverHelp.askStore=Відкрити Microsoft Store, щоб зараз установити безкоштовний пакет «OpenCL, OpenGL, and Vulkan Compatibility Pack»?

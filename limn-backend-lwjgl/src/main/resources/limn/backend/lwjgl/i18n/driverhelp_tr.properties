limn.driverHelp.heading=Bu bilgisayarda uygulamanın kullanabileceği bir grafik sürücüsü yok
limn.driverHelp.body=Uygulama OpenGL 3.3 gerektiriyor ve Windows bunu sağlayan bir sürücü bulamadı. Bu durum sanal makinelerde, uzak masaüstü oturumlarında ve sürücüsü yalnızca Direct3D sunan ekran kartlarında görülür.\n\nBilgisayarda ekran kartı varsa üreticinin sürücüsünü yükleyin veya güncelleyin. Yoksa Microsoft’un ücretsiz uyumluluk paketini yükleyin ve ardından uygulamayı yeniden açın.
limn.driverHelp.store=Microsoft Store’u aç
limn.driverHelp.storeNote=Ücretsiz “OpenCL, OpenGL, and Vulkan Compatibility Pack” paketini yükle
limn.driverHelp.winget=winget ile yükle
limn.driverHelp.wingetNote=Şunu çalıştıran bir komut penceresi açar:
limn.driverHelp.askStore=Ücretsiz “OpenCL, OpenGL, and Vulkan Compatibility Pack” paketini şimdi yüklemek için Microsoft Store açılsın mı?

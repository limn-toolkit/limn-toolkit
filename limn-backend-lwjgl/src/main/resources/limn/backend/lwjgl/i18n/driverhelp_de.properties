# Driver help: Deutsch (de)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Dieser Computer hat keinen Grafiktreiber, den die Anwendung nutzen kann
limn.driverHelp.body=Die Anwendung benötigt OpenGL 3.3, und Windows hat keinen Treiber gefunden, der es bereitstellt. Das kommt in virtuellen Maschinen, in Remotedesktopsitzungen und bei Grafikkarten vor, deren Treiber nur Direct3D anbietet.\n\nWenn der Computer eine Grafikkarte hat, installieren oder aktualisieren Sie den Treiber des Herstellers. Andernfalls installieren Sie das kostenlose Kompatibilitätspaket von Microsoft und öffnen die Anwendung danach erneut.
limn.driverHelp.store=Microsoft Store öffnen
limn.driverHelp.storeNote=Das kostenlose „OpenCL, OpenGL, and Vulkan Compatibility Pack“ installieren
limn.driverHelp.winget=Mit winget installieren
limn.driverHelp.wingetNote=Öffnet ein Befehlsfenster, das Folgendes ausführt:
limn.driverHelp.askStore=Microsoft Store jetzt öffnen, um das kostenlose „OpenCL, OpenGL, and Vulkan Compatibility Pack“ zu installieren?

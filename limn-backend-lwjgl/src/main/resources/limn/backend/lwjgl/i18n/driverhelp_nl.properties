# Driver help: Nederlands (nl)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=Deze computer heeft geen grafisch stuurprogramma dat de toepassing kan gebruiken
limn.driverHelp.body=De toepassing heeft OpenGL 3.3 nodig en Windows heeft geen stuurprogramma gevonden dat dit biedt. Dat gebeurt in virtuele machines, in sessies met Extern bureaublad en bij videokaarten waarvan het stuurprogramma alleen Direct3D biedt.\n\nAls de computer een videokaart heeft, installeer dan het stuurprogramma van de fabrikant of werk het bij. Installeer anders het gratis compatibiliteitspakket van Microsoft en open de toepassing daarna opnieuw.
limn.driverHelp.store=Microsoft Store openen
limn.driverHelp.storeNote=Het gratis ‘OpenCL, OpenGL, and Vulkan Compatibility Pack’ installeren
limn.driverHelp.winget=Installeren met winget
limn.driverHelp.wingetNote=Opent een opdrachtvenster dat het volgende uitvoert:
limn.driverHelp.askStore=Microsoft Store nu openen om het gratis ‘OpenCL, OpenGL, and Vulkan Compatibility Pack’ te installeren?

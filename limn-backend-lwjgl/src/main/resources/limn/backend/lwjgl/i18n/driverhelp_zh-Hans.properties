limn.driverHelp.heading=这台计算机没有应用程序可以使用的图形驱动程序
limn.driverHelp.body=应用程序需要 OpenGL 3.3，但 Windows 找不到提供它的驱动程序。这种情况出现在虚拟机、远程桌面会话，以及驱动程序只提供 Direct3D 的显卡上。\n\n如果计算机有显卡，请安装或更新显卡制造商的驱动程序。否则，请安装 Microsoft 的免费兼容包，然后重新打开应用程序。
limn.driverHelp.store=打开 Microsoft Store
limn.driverHelp.storeNote=安装免费的“OpenCL, OpenGL, and Vulkan Compatibility Pack”
limn.driverHelp.winget=使用 winget 安装
limn.driverHelp.wingetNote=打开一个命令窗口并运行：
limn.driverHelp.askStore=现在打开 Microsoft Store 安装免费的“OpenCL, OpenGL, and Vulkan Compatibility Pack”吗？

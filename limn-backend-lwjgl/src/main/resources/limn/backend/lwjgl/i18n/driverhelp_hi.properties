# Driver help: हिन्दी (hi)
# UTF-8. Keys not listed here fall back to the English the backend declares.
# Windows draws this text, not Limn: see DriverHelpStrings.

limn.driverHelp.heading=इस कंप्यूटर में ऐसा कोई ग्राफ़िक्स ड्राइवर नहीं है जिसे ऐप्लिकेशन उपयोग कर सके
limn.driverHelp.body=ऐप्लिकेशन को OpenGL 3.3 चाहिए, और Windows को ऐसा कोई ड्राइवर नहीं मिला जो इसे उपलब्ध कराए। ऐसा वर्चुअल मशीनों में, रिमोट डेस्कटॉप सत्रों में और उन ग्राफ़िक्स कार्ड पर होता है जिनका ड्राइवर केवल Direct3D देता है।\n\nअगर कंप्यूटर में ग्राफ़िक्स कार्ड है, तो उसके निर्माता का ड्राइवर इंस्टॉल या अपडेट करें। नहीं तो Microsoft का मुफ़्त संगतता पैक इंस्टॉल करें और फिर ऐप्लिकेशन दोबारा खोलें।
limn.driverHelp.store=Microsoft Store खोलें
limn.driverHelp.storeNote=मुफ़्त “OpenCL, OpenGL, and Vulkan Compatibility Pack” इंस्टॉल करें
limn.driverHelp.winget=winget से इंस्टॉल करें
limn.driverHelp.wingetNote=एक कमांड विंडो खोलता है जो यह चलाती है:
limn.driverHelp.askStore=मुफ़्त “OpenCL, OpenGL, and Vulkan Compatibility Pack” अभी इंस्टॉल करने के लिए Microsoft Store खोलें?

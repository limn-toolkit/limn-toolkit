limn.driverHelp.heading=لا يحتوي هذا الكمبيوتر على برنامج تشغيل رسومات يمكن للتطبيق استخدامه
limn.driverHelp.body=يحتاج التطبيق إلى OpenGL 3.3، ولم يعثر Windows على برنامج تشغيل يوفّره. يحدث هذا في الأجهزة الظاهرية وجلسات سطح المكتب البعيد وبطاقات الرسومات التي لا يوفّر برنامج تشغيلها سوى Direct3D.\n\nإذا كان في الكمبيوتر بطاقة رسومات، فثبّت برنامج التشغيل من الشركة المصنّعة أو حدّثه. وإلا فثبّت حزمة التوافق المجانية من Microsoft، ثم افتح التطبيق مرة أخرى.
limn.driverHelp.store=فتح Microsoft Store
limn.driverHelp.storeNote=تثبيت الحزمة المجانية «OpenCL, OpenGL, and Vulkan Compatibility Pack»
limn.driverHelp.winget=التثبيت باستخدام winget
limn.driverHelp.wingetNote=يفتح نافذة أوامر تنفّذ:
limn.driverHelp.askStore=هل تريد فتح Microsoft Store لتثبيت الحزمة المجانية «OpenCL, OpenGL, and Vulkan Compatibility Pack» الآن؟

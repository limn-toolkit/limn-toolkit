[versions]
lwjgl = "3.4.1"
jlayer = "1.0.1"
junit = "6.1.3"
central-publish = "0.37.0"
# The faces, from the limn-fonts repository, where each versions with its font rather than with
# this toolkit (ADR 036). Bumping one of these swaps megabytes of binary nobody reviews in a
# one-line diff; VendoredFontsTest is what makes that diff fail until the new build's digests
# and ComplexScriptFallbackTest's layout facts are re-verified against it.
limn-fonts-roboto = "1.0.1"
limn-fonts-noto-cjk = "2.004.1"
limn-fonts-noto-emoji = "2.051.1"
limn-fonts-noto-scripts = "1.0.1"
# The FFmpeg payload, from the limn-ffmpeg-natives repository, versioned with FFmpeg (ADR 037):
# the first three components are the FFmpeg inside, the fourth is that repository's packaging.
# limn-video-ffmpeg depends on its main jar (the JNI shim); the six natives-<os>-<arch>
# classifiers are an application's choice, and limn-video-ffmpeg-natives-all names them at this
# exact version. The shim's ABI number is checked at load time (FfmpegLibrary.EXPECTED_ABI).
limn-ffmpeg-natives = "7.1.5.0"
# The Tabler icon pack, from the limn-icons-tabler repository, versioned with Tabler (ADR 038):
# the first three components are the Tabler release inside, the fourth that repository's own.
# Compiled against the published toolkit as compileOnly, so it names no toolkit version and
# nothing here depends on it but the demo — an application, which is the shape a pack is for.
limn-icons-tabler = "3.46.0.0"

[libraries]
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
jlayer = { module = "javazoom:jlayer", version.ref = "jlayer" }
lwjgl-core = { module = "org.lwjgl:lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb" }
lwjgl-harfbuzz = { module = "org.lwjgl:lwjgl-harfbuzz" }
lwjgl-nanovg = { module = "org.lwjgl:lwjgl-nanovg" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd" }
limn-fonts-roboto = { module = "io.github.limn-toolkit:limn-fonts-roboto", version.ref = "limn-fonts-roboto" }
limn-fonts-noto-cjk = { module = "io.github.limn-toolkit:limn-fonts-noto-cjk", version.ref = "limn-fonts-noto-cjk" }
limn-fonts-noto-emoji = { module = "io.github.limn-toolkit:limn-fonts-noto-emoji", version.ref = "limn-fonts-noto-emoji" }
limn-fonts-noto-scripts = { module = "io.github.limn-toolkit:limn-fonts-noto-scripts", version.ref = "limn-fonts-noto-scripts" }
limn-ffmpeg-natives = { module = "io.github.limn-toolkit:limn-ffmpeg-natives", version.ref = "limn-ffmpeg-natives" }
limn-icons-tabler = { module = "io.github.limn-toolkit:limn-icons-tabler", version.ref = "limn-icons-tabler" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# Maven Central's own upload API takes a signed bundle, which `maven-publish` alone cannot
# produce: this plugin is what turns the publications below into that bundle, signs every
# artifact in it, and hands it to the Central Portal.
central-publish = { id = "com.vanniktech.maven.publish", version.ref = "central-publish" }

# The version the NEXT release of the toolkit carries — the single place it is written.
#
# Two readers of one file, the same arrangement as limn-fonts, limn-ffmpeg-natives and
# limn-icons-tabler: build.gradle.kts turns it into every module's default (-SNAPSHOT) version,
# and the tag-releases workflow turns it into the release on every push to main — tagging
# v<version> and starting publish, which checks, uploads and drafts. Nothing else changes for a
# release: the documentation carries placeholders (x.y.z in the READMEs, {{version}} in the
# guides, filled in by the site at deploy time), never the number, and scripts/check-versions.sh
# refuses a literal. Landing a bumped entry on main IS the release decision; the deployment then
# waits for a human's Publish on the Central Portal, and the GitHub release waits as a draft.
#
# Every module published from here (limn-toolkit, limn-backend-lwjgl, limn-video-ffmpeg,
# limn-theme-editor, limn-video-ffmpeg-natives-all, limn-fonts-all) carries this version. The
# artifacts that version on their own cadence — the fonts, the FFmpeg payload, the icon pack —
# are pinned in gradle/libs.versions.toml instead.
limn-toolkit=0.6.0
